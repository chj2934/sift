[project]
name = "sift"
version = "0.1.0"
description = "Obsidian-like vector memory for bug bounty hunting — RAG knowledge base + MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Caleb J" }]
dependencies = [
    "anthropic>=0.40",
    # merge_insert(...).when_not_matched_by_source_delete, optimize(cleanup_older_than),
    # list_indices and index_stats: verified on 0.38.
    "lancedb>=0.38",
    "pyarrow>=17",
    "fastembed>=0.7",
    # onnxruntime 1.29.x has a severe CPU inference regression (~5x slower). Pin below it.
    "onnxruntime>=1.19,<1.29",
    "fastmcp>=4",
    # mcp >= 2.1 points fd 1 at stderr while serving stdio, so a stray print() cannot
    # land between JSON-RPC frames. fastmcp 4 alone only requires mcp >= 2.0.
    "mcp>=2.1.1",
    # Cross-process locks: vault writes, the tombstone ledger, the ingest state file.
    # (Already installed through huggingface_hub; declared because sift imports it.)
    "filelock>=3.12",
    "typer>=0.12",
    "rich>=13.7",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    # httpx decodes gzip/deflate on its own but needs these for `br` and `zstd`.
    # Without them, brotli-serving sites (a lot of modern blogs behind CDNs) come
    # back as undecoded binary that silently becomes note text.
    "brotli>=1.1",
    "zstandard>=0.22",
    "feedparser>=6.0",
    # Article extraction. The regex stripper left every navigation menu in the note
    # text; trafilatura understands article structure. Regex remains the fallback.
    "trafilatura>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-slugify>=8.0",
]

[project.scripts]
sift = "sift.cli:app"

[project.optional-dependencies]
# GPU embeddings. The torch wheel bundles CUDA, so only an NVIDIA driver is
# needed (no system CUDA/cuDNN install). Uses the CUDA 13 torch index below;
# if your driver is older, change cu130 -> cu126 in [[tool.uv.index]].
gpu = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# T20 (no print): in a library module a print() reaches stdout, which is the MCP
# server's JSON-RPC wire. Use logging.getLogger(__name__); the CLI routes it to stderr.
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
ignore = ["E501"]  # long lines are mostly URLs / test fixtures; not worth wrapping

[tool.ruff.lint.per-file-ignores]
# stdout reconfigure must run before importing typer/rich; stdout is the CLI's output.
"src/sift/cli.py" = ["E402", "T20"]
"tests/*" = ["E402", "T20"]  # tests import inside functions to hit the isolated-env fixture first

[tool.pytest.ini_options]
testpaths = ["tests"]
# Calibration hits the live API and costs money; opt in with `-m calibration`.
addopts = "-q -m 'not calibration'"
markers = [
    "calibration: live novelty-gate checks (needs Anthropic credentials, costs a few cents)",
]
