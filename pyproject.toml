[project]
name = "sift"
version = "0.1.0"
description = "Obsidian-like vector memory for bug bounty hunting — RAG knowledge base + MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Caleb J" }]
dependencies = [
    "lancedb>=0.20",
    "pyarrow>=17",
    "fastembed>=0.7",
    # onnxruntime 1.29.x has a severe CPU inference regression (~5x slower). Pin below it.
    "onnxruntime>=1.19,<1.29",
    "fastmcp>=3",
    "typer>=0.12",
    "rich>=13.7",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-slugify>=8.0",
]

[project.scripts]
sift = "sift.cli:app"

[project.optional-dependencies]
# GPU embeddings. The torch wheel bundles CUDA, so only an NVIDIA driver is
# needed (no system CUDA/cuDNN install). Uses the CUDA 13 torch index below;
# if your driver is older, change cu130 -> cu126 in [[tool.uv.index]].
gpu = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "gpu" }]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines are mostly URLs / test fixtures; not worth wrapping

[tool.ruff.lint.per-file-ignores]
"src/sift/cli.py" = ["E402"]  # stdout reconfigure must run before importing typer/rich
"tests/*" = ["E402"]  # tests import inside functions to hit the isolated-env fixture first

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
